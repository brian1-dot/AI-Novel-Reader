name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure preinstalled Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK and capture errors
        id: compile
        continue-on-error: true
        run: |
          gradle --no-daemon assembleDebug --stacktrace > build.log 2>&1
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build.log
      - name: Report build error automatically
        if: steps.compile.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Automated build error report for commit ${GITHUB_SHA}."
            echo '~~~'
            grep -E -A 12 -B 3 'error:|FAILURE:|What went wrong:|Execution failed|cannot find symbol|Compilation failed' build.log | head -c 12000 || true
            echo '~~~'
          } > error.md
          gh issue create --title "APK build error ${GITHUB_SHA:0:7}" --body-file error.md
      - name: Mark build failed
        if: steps.compile.outcome == 'failure'
        run: exit 1
      - name: Upload installable APK
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AI-Novel-Reader-APK
          path: app/build/outputs/apk/debug/app-debug.apk
